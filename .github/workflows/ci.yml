name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: PHP ${{ matrix.php }} ${{ matrix.ts }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        php: ['8.4', '8.5']
        ts: [nts, zts]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
        env:
          phpts: ${{ matrix.ts == 'zts' && 'ts' || 'nts' }}

      - name: Install GLFW 3.4 (Linux)
        # Ubuntu 24.04 packages GLFW 3.3.10 and config.m4 requires 3.4, so build the 3.4 release.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev libwayland-dev wayland-protocols
          curl -fsSL https://github.com/glfw/glfw/archive/refs/tags/3.4.tar.gz | tar -xz -C /tmp
          cmake -S /tmp/glfw-3.4 -B /tmp/glfw-build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_DOCS=OFF
          cmake --build /tmp/glfw-build -j"$(nproc)"
          sudo cmake --install /tmp/glfw-build
          sudo ldconfig

      - name: Install GLFW (macOS)
        if: runner.os == 'macOS'
        run: brew install glfw pkgconf

      - name: Build
        run: |
          phpize
          ./configure --enable-glfw
          make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Load
        run: |
          php -n -d extension="$PWD/modules/glfw.so" -r 'exit(extension_loaded("glfw") ? 0 : 1);'
          php -n -d extension="$PWD/modules/glfw.so" --ri glfw
